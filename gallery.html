<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photo gallery of KMM Lifestyle — luxury rooms, living spaces, and premium accommodation in Vanderbijlpark." />
  <title>KMM Lifestyle | Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="features.css" />
</head>
<body data-page="gallery">
  <div id="site-header"></div>
  <main class="page-main">
    <section class="page-hero">
      <div class="container">
        <span class="section__tag">Our Moments</span>
        <h1>KMM Lifestyle <em>Photos</em></h1>
        <p>A glimpse into the luxury, comfort, and style that define every stay with us.</p>
      </div>
    </section>
    <section class="gallery section">
      <div class="container">
        <div class="gallery__grid" id="galleryGrid">
          <figure class="gallery__item gallery__item--wide reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 1"><img src="images/IMG-20260527-WA0011.jpg" alt="KMM Lifestyle — photo 1" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 2"><img src="images/IMG-20260527-WA0012.jpg" alt="KMM Lifestyle — photo 2" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 3"><img src="images/IMG-20260527-WA0013.jpg" alt="KMM Lifestyle — photo 3" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 4"><img src="images/IMG-20260527-WA0014.jpg" alt="KMM Lifestyle — photo 4" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item gallery__item--tall reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 5"><img src="images/IMG-20260527-WA0015.jpg" alt="KMM Lifestyle — photo 5" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 6"><img src="images/IMG-20260527-WA0016.jpg" alt="KMM Lifestyle — photo 6" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 7"><img src="images/IMG-20260527-WA0017.jpg" alt="KMM Lifestyle — photo 7" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 8"><img src="images/IMG-20260527-WA0018.jpg" alt="KMM Lifestyle — photo 8" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 9"><img src="images/IMG-20260527-WA0019.jpg" alt="KMM Lifestyle — photo 9" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 10"><img src="images/IMG-20260527-WA0020.jpg" alt="KMM Lifestyle — photo 10" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 11"><img src="images/IMG-20260527-WA0021.jpg" alt="KMM Lifestyle — photo 11" loading="lazy" decoding="async" /></button></figure>
          <figure class="gallery__item reveal visible"><button type="button" class="gallery__trigger" aria-label="View photo 12"><img src="images/IMG-20260527-WA0022.jpg" alt="KMM Lifestyle — photo 12" loading="lazy" decoding="async" /></button></figure>
        </div>
      </div>
    </section>
  </main>
  <div class="gallery-lightbox" id="galleryLightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="galleryLightboxCaption">
    <div class="gallery-lightbox__overlay" data-gallery-close></div>
    <button type="button" class="gallery-lightbox__close" data-gallery-close aria-label="Close photo">&times;</button>
    <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--prev" id="galleryPrev" aria-label="Previous photo">&#8249;</button>
    <div class="gallery-lightbox__stage">
      <img id="galleryLightboxImg" alt="" />
      <p class="gallery-lightbox__caption" id="galleryLightboxCaption"></p>
    </div>
    <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--next" id="galleryNext" aria-label="Next photo">&#8250;</button>
  </div>
  <div id="site-footer"></div>
  <div id="site-extras"></div>
  <script src="api.js"></script>
  <script src="client-store.js"></script>
  <script src="bookings-store.js"></script>
  <script src="accommodation-store.js"></script>
  <script src="image-utils.js"></script>
  <script src="gallery-page.js"></script>
  <script src="i18n.js"></script>
  <script src="site-paths.js"></script>
  <script src="bank-details.js"></script>
  <script src="layout.js"></script>
  <script src="site-features.js"></script>
  <script src="booking-flow.js"></script>
  <script src="script.js"></script>
</body>
</html>
